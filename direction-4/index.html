function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260707);
const jitter = (amt) => (rand() * 2 - 1) * amt;

const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const matCache = new Map();
function flat(color) {
  if (!matCache.has('f' + color)) matCache.set('f' + color, new THREE.MeshBasicMaterial({ color }));
  return matCache.get('f' + color);
}
function lit(color, rough = 0.7, metal = 0) {
  const k = 'l' + color + rough + metal;
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal }));
  return matCache.get(k);
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function toTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function remapUVsToBounds(geometry) {
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const sx = bb.max.x - bb.min.x, sy = bb.max.y - bb.min.y;
  const pos = geometry.attributes.position;
  const uv = geometry.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    uv.setXY(i, (pos.getX(i) - bb.min.x) / sx, (pos.getY(i) - bb.min.y) / sy);
  }
  uv.needsUpdate = true;
}
function roundedPolygonShape(points, radius) {
  const shape = new THREE.Shape();
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const p = points[i];
    const prev = points[(i + n - 1) % n];
    const next = points[(i + 1) % n];
    const dPrev = p.clone().sub(prev).normalize();
    const dNext = next.clone().sub(p).normalize();
    const pA = p.clone().sub(dPrev.clone().multiplyScalar(radius));
    const pB = p.clone().add(dNext.clone().multiplyScalar(radius));
    if (i === 0) shape.moveTo(pA.x, pA.y); else shape.lineTo(pA.x, pA.y);
    shape.quadraticCurveTo(p.x, p.y, pB.x, pB.y);
  }
  shape.closePath();
  return shape;
}
function roundedRectShape(w, h, r) {
  return roundedPolygonShape([
    new THREE.Vector2(-w / 2, -h / 2), new THREE.Vector2(w / 2, -h / 2),
    new THREE.Vector2(w / 2, h / 2), new THREE.Vector2(-w / 2, h / 2),
  ], r);
}
function regPolyShape(n, R, rotDeg = 0, corner = 0.05) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (rotDeg * Math.PI) / 180;
    pts.push(new THREE.Vector2(Math.cos(a) * R, Math.sin(a) * R));
  }
  return roundedPolygonShape(pts, corner);
}
// flat sign: extruded silhouette + canvas art on the face
function flatSign(shape, canvas, depth = 0.06, sideColor = PAL.cream) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 26 }),
    flat(sideColor)
  );
  body.castShadow = true;
  g.add(body);
  const faceGeo = new THREE.ShapeGeometry(shape, 26);
  remapUVsToBounds(faceGeo);
  const face = new THREE.Mesh(faceGeo, new THREE.MeshBasicMaterial({ map: toTexture(canvas) }));
  face.position.z = depth + 0.002;
  g.add(face);
  return g;
}

function artUTurnOctagon() {
  const [c, ctx] = makeCanvas(512, 512);
  ctx.fillStyle = PAL.pink; ctx.fillRect(0, 0, 512, 512);
  // vermillion octagon border
  ctx.strokeStyle = PAL.verm; ctx.lineWidth = 26;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    const x = 256 + Math.cos(a) * 212, y = 256 - Math.sin(a) * 212;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  // blue U-turn arrow
  ctx.strokeStyle = PAL.blue; ctx.lineWidth = 44; ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.arc(256, 250, 82, Math.PI, 0, false);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(338, 250); ctx.lineTo(338, 330); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(174, 250); ctx.lineTo(174, 300); ctx.stroke();
  ctx.fillStyle = PAL.blue;
  ctx.beginPath();
  ctx.moveTo(174 - 58, 300); ctx.lineTo(174 + 58, 300); ctx.lineTo(174, 396);
  ctx.closePath(); ctx.fill();
  return c;
}
function artWavy(bg, line, border) {
  const [c, ctx] = makeCanvas(1024, 460);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 1024, 460);
  ctx.strokeStyle = border; ctx.lineWidth = 22;
  ctx.strokeRect(30, 30, 964, 400);
  ctx.strokeStyle = line; ctx.lineWidth = 30; ctx.lineCap = 'round';
  for (let row = 0; row < 3; row++) {
    const y = 130 + row * 100;
    ctx.beginPath();
    for (let x = 110; x <= 914; x += 6) {
      const yy = y + Math.sin((x - 110) / 44 + row * 1.4) * 26;
      x === 110 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  return c;
}
function artBigArrow() {
  const [c, ctx] = makeCanvas(1024, 460);

const artefacts = [];
const hitMeshes = [];
const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });

function register(objGroup, post, hitR, hitOffset = new THREE.Vector3()) {
  const art = { post, group: objGroup, base: objGroup.position.clone(), phase: rand() * Math.PI * 2, hoverK: 0 };
  const hit = new THREE.Mesh(new THREE.SphereGeometry(hitR, 8, 8), hitMat);
  hit.position.copy(hitOffset);
  objGroup.add(hit);
  hit.userData.artefact = art;
  hitMeshes.push(hit);
  artefacts.push(art);
  return art;
}

const POLE_R = 0.11;

{

  const foot = new THREE.Mesh(new THREE.CylinderGeometry(POLE_R * 1.7, POLE_R * 2.2, 0.34, 24), lit(PAL.navy, 0.6));

/* ---------- street boxes (ground, right) ---------- */
function streetBox({ w, h, d, body, top, x, z, ry = 0, stickers = false, slot = true }) {
  const g = new THREE.Group();
  const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lit(body, 0.55));
  bodyMesh.position.y = h / 2;
  g.add(bodyMesh);
  // half-cylinder ridge along the depth, bulging upward
  const dome = new THREE.Mesh(
    new THREE.CylinderGeometry(w / 2, w / 2, d, 24, 1, false, Math.PI / 2, Math.PI),
    lit(top, 0.55)
  );
  dome.rotation.x = Math.PI / 2;
  dome.position.y = h;
  g.add(dome);
  if (slot) {
    const slotMesh = new THREE.Mesh(new THREE.BoxGeometry(w * 0.62, 0.07, 0.03), lit(PAL.navy, 0.5));
    slotMesh.position.set(0, h * 0.78, d / 2 + 0.012);
    g.add(slotMesh);
  }
  if (stickers) {
    const s1 = new THREE.Mesh(new THREE.CircleGeometry(0.09, 20), flat(PAL.cream));
    s1.position.set(-0.12, h * 0.5, d / 2 + 0.012);
    g.add(s1);
    const s2 = new THREE.Mesh(new THREE.CircleGeometry(0.06, 20), flat(PAL.verm));
    s2.position.set(0.16, h * 0.38, d / 2 + 0.012);
    g.add(s2);
    const s3 = new THREE.Mesh(new THREE.CircleGeometry(0.05, 20), flat(PAL.pinkDeep));
    s3.position.set(0.05, h * 0.6, d / 2 + 0.012);
    g.add(s3);
  }
  const foot = new THREE.Mesh(new THREE.BoxGeometry(w * 0.8, 0.08, d * 0.8), lit(PAL.navy, 0.55));
  foot.position.y = 0.04;
  g.add(foot);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  scene.add(g);
  return g;
}

/* ------------------------------ reading veil ------------------------------- */
const veil = document.getElementById('veil');
const sheet = document.getElementById('sheet');
const articleEl = document.getElementById('article');
const indexEl = document.getElementById('indexList');
const idxUl = document.getElementById('idx-ul');
let veilOpen = false;

const TAG_COLORS = {
  life: PAL.pinkDeep, misc: PAL.pinkDeep, absurd: PAL.verm,
  design: PAL.blue, company: PAL.blue, work: PAL.blue,
  about: PAL.navy, wayfinding: PAL.verm, manifesto: PAL.verm,
};

function openWriting(post) {
  articleEl.classList.remove('off');
  indexEl.classList.remove('on');
  document.getElementById('w-dot').style.background = TAG_COLORS[post.tag] || PAL.navy;
  document.getElementById('w-tag').textContent = post.tag;
  document.getElementById('w-date').textContent = post.date;
  document.getElementById('w-title').textContent = post.title;
  document.getElementById('w-body').textContent = post.body;
  veil.classList.add('open');
  veilOpen = true;
}
function openIndex() {
  articleEl.classList.add('off');
  indexEl.classList.add('on');
  idxUl.innerHTML = '';
  for (const post of POSTS) {
    const li = document.createElement('li');
    const dot = document.createElement('span');
    dot.className = 'idot';
    dot.style.background = TAG_COLORS[post.tag] || PAL.navy;
    const title = document.createElement('span');
    title.className = 'ititle';
    title.textContent = post.title;
    const tag = document.createElement('span');
    tag.className = 'itag';
    tag.textContent = post.tag;
    const date = document.createElement('span');
    date.className = 'idate';
    date.textContent = post.date;
    li.append(dot, title, tag, date);
    li.addEventListener('click', (e) => {
      e.stopPropagation();
      openWriting(post);
    });
    idxUl.appendChild(li);
  }
  veil.classList.add('open');
  veilOpen = true;
}
function closeVeil() {
  veil.classList.remove('open');
  veilOpen = false;
}
veil.addEventListener('click', closeVeil);
sheet.addEventListener('click', (e) => e.stopPropagation());
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVeil(); });

/* ------------------------------ interaction -------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
let hovered = null;
let pointerDown = { x: 0, y: 0, moved: false };

renderer.domElement.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  if (Math.abs(e.clientX - pointerDown.x) + Math.abs(e.clientY - pointerDown.y) > 6) {
    pointerDown.moved = true;
  }
});
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDown = { x: e.clientX, y: e.clientY, moved: false };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (pointerDown.moved || veilOpen) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  if (!hits.length) return;
  const art = hits[0].object.userData.artefact;
  if (art.post.id === '__index') openIndex();
  else openWriting(art.post);
});

/* -------------------------------- animate ---------------------------------- */
const clock = new THREE.Clock();
let introT = 0;
for (const a of artefacts) a.group.scale.setScalar(0.0001);

function easeOutBack(t) {
  const c1 = 1.30158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
const introOrder = [...artefacts].sort((a, b) => a.base.y - b.base.y);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  introT += dt;

  introOrder.forEach((a, i) => {
    const local = THREE.MathUtils.clamp((introT - 0.3 - i * 0.09) / 0.6, 0, 1);
    const k = local >= 1 ? 1 : Math.max(0.0001, easeOutBack(local));
    const target = a === hovered ? 1 : 0;
    a.hoverK += (target - a.hoverK) * Math.min(1, dt * 9);
    a.group.scale.setScalar(k * (1 + a.hoverK * 0.05));
    // breathe
    a.group.position.y = a.base.y + Math.sin(t * 0.8 + a.phase) * 0.012 + a.hoverK * 0.04;
  });

  if (!veilOpen) {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(hitMeshes, false);
    const found = hits.length ? hits[0].object.userData.artefact : null;
    if (found !== hovered) {
      hovered = found;
      document.body.style.cursor = hovered ? 'pointer' : 'default';
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

document.getElementById('loader').classList.add('done');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
