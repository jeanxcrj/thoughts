import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════════════════
   THE WRITINGS — edit this list to grow the archive.
   ═══════════════════════════════════════════════════════════════════════════ */
const POSTS = [

    body: `A garden asks for land. A pole only asks for a place to stand.

I like that. I move a lot — cities, jobs, versions of myself — and the pole comes along, holding everything I've written on the way. Some of it blooms. Some of it is bolted on. All of it points somewhere I've been or somewhere I'm going. This is not a portfolio. It is a lamppost I keep talking to.`,

Today I fixed a sentence, walked the long way for milk, and said "you too" when the barista said "enjoy your drink." The middle is not the wait between meanings. It is the meaning, wearing ordinary clothes.`,
  },

It never once says sorry for the mess. I bought three. I am taking notes.`,

    body: `People renovate products the way bad landlords renovate apartments — rip out what looks old, keep whatever the floor plan happens to imply. Then the ceiling sags and everyone blames the paint.

Design is not the paint. It is the wall you find out was structural. The interview flow, the pricing page, the empty state at 2 a.m. — knock those down carelessly and the whole thing leans. Good designers walk in with a stud finder, not a mood board.`,

Everyone asks what mold you'll pour it into. The honest answer is that the mold is made of the first ten people, the first hundred no's, and whatever you refuse to stop believing on the worst day. It cools into a shape you only recognize afterward. Keep it molten a little longer than is comfortable. Most things harden too early, not too late.`,

/* ═══════════════════════════════════════════════════════════════════════════ */

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260707);
const jitter = (amt) => (rand() * 2 - 1) * amt;

/* -------------------------------- palette --------------------------------- */
const PAL = {
  red: '#e8401c',
  redDeep: '#c73312',
  blue: '#2244e0',
  blueDeep: '#1a35b5',
  pink: '#ff9ec6',
  pinkDeep: '#f070a8',
  yellow: '#f2b63d',
  cream: '#fbf9f4',
  black: '#161616',
  white: '#ffffff',
  pole: '#cfc8ba',
  poleDark: '#8f887a',
};

/* ------------------------------- renderer -------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.cream);
scene.fog = new THREE.Fog(PAL.cream, 20, 45);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(0, 1.9, 12.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 17;
controls.minPolarAngle = Math.PI * 0.38;
controls.maxPolarAngle = Math.PI * 0.54;
controls.minAzimuthAngle = -0.62;
controls.maxAzimuthAngle = 0.62;

/* --------------------------------- light ---------------------------------- */
// the graphics are unlit (flat, 2D); light exists only for the ground shadows
scene.add(new THREE.HemisphereLight(0xffffff, 0xf4efe4, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 12, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0002;
key.shadow.radius = 10;
key.shadow.blurSamples = 16;
scene.add(key);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: PAL.cream, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------ flat helpers ------------------------------ */
const matCache = new Map();
function flat(color) {
  if (!matCache.has(color)) matCache.set(color, new THREE.MeshBasicMaterial({ color }));
  return matCache.get(color);
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function toTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function remapUVsToBounds(geometry) {
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const sx = bb.max.x - bb.min.x, sy = bb.max.y - bb.min.y;
  const pos = geometry.attributes.position;
  const uv = geometry.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    uv.setXY(i, (pos.getX(i) - bb.min.x) / sx, (pos.getY(i) - bb.min.y) / sy);
  }
  uv.needsUpdate = true;
}
function extrudeFlat(shape, depth, color) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 28 });
  const mesh = new THREE.Mesh(geo, flat(color));
  mesh.castShadow = true;
  return mesh;
}
function roundedPolygonShape(points, radius) {
  const shape = new THREE.Shape();
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const p = points[i];
    const prev = points[(i + n - 1) % n];
    const next = points[(i + 1) % n];
    const dPrev = p.clone().sub(prev).normalize();
    const dNext = next.clone().sub(p).normalize();
    const pA = p.clone().sub(dPrev.clone().multiplyScalar(radius));
    const pB = p.clone().add(dNext.clone().multiplyScalar(radius));
    if (i === 0) shape.moveTo(pA.x, pA.y); else shape.lineTo(pA.x, pA.y);
    shape.quadraticCurveTo(p.x, p.y, pB.x, pB.y);
  }
  shape.closePath();
  return shape;
}
function regPolyShape(n, R, rotDeg = 0, corner = 0.05) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (rotDeg * Math.PI) / 180;
    pts.push(new THREE.Vector2(Math.cos(a) * R, Math.sin(a) * R));
  }
  return roundedPolygonShape(pts, corner);
}
function circleShape(R) {
  const s = new THREE.Shape();
  s.absarc(0, 0, R, 0, Math.PI * 2, false);
  return s;
}
function roundedRectShape(w, h, r) {
  const pts = [
    new THREE.Vector2(-w / 2, -h / 2), new THREE.Vector2(w / 2, -h / 2),
    new THREE.Vector2(w / 2, h / 2), new THREE.Vector2(-w / 2, h / 2),
  ];
  return roundedPolygonShape(pts, r);
}
function bladeShape(w, h, pointRight = true) {
  const tip = h * 0.55;
  const pts = pointRight
    ? [
        new THREE.Vector2(-w / 2, -h / 2), new THREE.Vector2(w / 2 - tip, -h / 2),
        new THREE.Vector2(w / 2, 0), new THREE.Vector2(w / 2 - tip, h / 2),
        new THREE.Vector2(-w / 2, h / 2),
      ]
    : [
        new THREE.Vector2(-w / 2 + tip, -h / 2), new THREE.Vector2(w / 2, -h / 2),
        new THREE.Vector2(w / 2, h / 2), new THREE.Vector2(-w / 2 + tip, h / 2),
        new THREE.Vector2(-w / 2, 0),
      ];
  return roundedPolygonShape(pts, 0.04);
}

/* ------------------------------ arrow shapes ------------------------------ */
function straightArrowShape(len, T) {
  const headL = T * 1.7, headW = T * 1.6;
  const s = new THREE.Shape();
  s.moveTo(-len / 2, -T / 2);
  s.lineTo(len / 2 - headL, -T / 2);
  s.lineTo(len / 2 - headL, -headW);
  s.lineTo(len / 2, 0);
  s.lineTo(len / 2 - headL, headW);
  s.lineTo(len / 2 - headL, T / 2);
  s.lineTo(-len / 2, T / 2);
  s.closePath();
  return s;
}
// runs +x for xc, bends 90° upward, then rises L2; head at top
function bentArrowShape(xc, L2, T, R) {
  const headL = T * 1.5, headW = T * 0.75;
  const topY = R + L2;
  const s = new THREE.Shape();
  s.moveTo(0, -T / 2);
  s.lineTo(xc, -T / 2);
  s.absarc(xc, R, R + T / 2, -Math.PI / 2, 0, false);
  s.lineTo(xc + R + T / 2, topY);
  s.lineTo(xc + R + T / 2 + headW, topY);
  s.lineTo(xc + R, topY + headL);
  s.lineTo(xc + R - T / 2 - headW, topY);
  s.lineTo(xc + R - T / 2, topY);
  s.lineTo(xc + R - T / 2, R);
  s.absarc(xc, R, R - T / 2, 0, -Math.PI / 2, true);
  s.lineTo(0, T / 2);
  s.closePath();
  return s;
}
// half-loop over the top, both legs pointing down, head on the right leg
function uTurnArrowShape(R, T, tail) {
  const Ro = R + T / 2, Ri = R - T / 2;
  const headL = T * 1.5, headW = T * 0.75;
  const s = new THREE.Shape();
  s.moveTo(-Ro, -tail);
  s.lineTo(-Ro, 0);
  s.absarc(0, 0, Ro, Math.PI, 0, true);
  s.lineTo(Ro, -tail + headL);
  s.lineTo(Ro + headW, -tail + headL);
  s.lineTo(R, -tail - headL * 0.7);
  s.lineTo(Ri - headW, -tail + headL);
  s.lineTo(Ri, -tail + headL);
  s.lineTo(Ri, 0);
  s.absarc(0, 0, Ri, 0, Math.PI, false);
  s.lineTo(-Ri, -tail);
  s.closePath();
  return s;
}

/* ------------------------------ face graphics ----------------------------- */
const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

function canvasFace(shape, canvas, z) {
  const geo = new THREE.ShapeGeometry(shape, 28);
  remapUVsToBounds(geo);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: toTexture(canvas) }));
  m.position.z = z;
  return m;
}
function smileyFace(r, z, color = PAL.black) {
  const [c, ctx] = makeCanvas(256, 256);
  ctx.clearRect(0, 0, 256, 256);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(88, 104, 13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(168, 104, 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(128, 128, 46, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  const tex = toTexture(c);
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(r, 32),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  m.position.z = z;
  return m;
}

/* ------------------------------ sign builders -----------------------------
   Every head is a flat extrusion (unlit) with graphic front face. ---------- */
const D = 0.055; // sign thickness

function headOctagon({ R, bg, ring, label, labelColor }) {
  const shape = regPolyShape(8, R, 22.5, R * 0.08);
  const g = new THREE.Group();
  g.add(extrudeFlat(shape, D, bg));
  const [c, ctx] = makeCanvas(512, 512);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = ring; ctx.lineWidth = 26;
  // octagon border inset
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + (22.5 * Math.PI) / 180;
    const x = 256 + Math.cos(a) * 205, y = 256 - Math.sin(a) * 205;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = labelColor;
  ctx.font = `bold ${label.length > 2 ? 150 : 220}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, 256, 268);
  g.add(canvasFace(shape, c, D + 0.002));
  g.userData.halfW = R;
  return g;
}
function headCircle({ R, bg, ring, label, labelColor, wavy = false }) {
  const shape = circleShape(R);
  const g = new THREE.Group();
  g.add(extrudeFlat(shape, D, bg));
  const [c, ctx] = makeCanvas(512, 512);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = ring; ctx.lineWidth = 30;
  ctx.beginPath(); ctx.arc(256, 256, 208, 0, Math.PI * 2); ctx.stroke();
  if (wavy) {
    ctx.strokeStyle = labelColor;
    ctx.lineWidth = 22; ctx.lineCap = 'round';
    for (let row = 0; row < 3; row++) {
      const y = 190 + row * 64;
      ctx.beginPath();
      for (let x = 120; x <= 392; x += 4) {
        const yy = y + Math.sin((x - 120) / 26 + row) * 16;
        x === 120 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = labelColor;
    ctx.font = `bold ${label.length > 2 ? 150 : 230}px ${label === '∞' ? 'Georgia, serif' : FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 256, 262);
  }
  g.add(canvasFace(shape, c, D + 0.002));
  g.userData.halfW = R;
  return g;
}
function headTriangle({ size, bg, inner, label, labelColor }) {
  const R = size * 0.62;
  const pts = [90, 210, 330].map((deg) => {
    const a = (deg * Math.PI) / 180;
    return new THREE.Vector2(Math.cos(a) * R, Math.sin(a) * R);
  });
  const shape = roundedPolygonShape(pts, size * 0.1);
  const g = new THREE.Group();
  g.add(extrudeFlat(shape, D, bg));
  const [c, ctx] = makeCanvas(512, 460);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 460);
  const apex = [256, 26], bl = [30, 434], br = [482, 434];
  const cx0 = 256, cy0 = 300;
  const tri = (inset) => {
    ctx.beginPath();
    [apex, br, bl].forEach((p, i) => {
      const x = p[0] + (cx0 - p[0]) * inset;
      const y = p[1] + (cy0 - p[1]) * inset;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
  };
  ctx.fillStyle = inner; tri(0.22); ctx.fill();
  ctx.fillStyle = labelColor;
  ctx.font = `bold 190px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, 256, 330);
  g.add(canvasFace(shape, c, D + 0.002));
  g.userData.halfW = size * 0.55;
  return g;
}
function headSquare({ w, bg, border, label, labelColor, arrowUp = false }) {
  const shape = roundedRectShape(w, w, w * 0.1);
  const g = new THREE.Group();
  g.add(extrudeFlat(shape, D, bg));
  const [c, ctx] = makeCanvas(512, 512);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = border; ctx.lineWidth = 24;
  ctx.strokeRect(38, 38, 436, 436);
  ctx.fillStyle = labelColor;
  if (arrowUp) {
    ctx.save();
    ctx.translate(256, 210);
    ctx.beginPath();
    ctx.moveTo(0, -120); ctx.lineTo(95, 0); ctx.lineTo(38, 0);
    ctx.lineTo(38, 130); ctx.lineTo(-38, 130); ctx.lineTo(-38, 0);
    ctx.lineTo(-95, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.font = `bold 74px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText(label, 256, 448);
  } else {
    ctx.font = `bold 200px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 256, 270);
  }
  g.add(canvasFace(shape, c, D + 0.002));
  g.userData.halfW = w / 2;
  return g;
}
function headBlade({ w, h, bg, label, labelColor, pointRight = true }) {
  const shape = bladeShape(w, h, pointRight);
  const g = new THREE.Group();
  g.add(extrudeFlat(shape, D, bg));
  const [c, ctx] = makeCanvas(1024, Math.round((1024 * h) / w));
  const ch = c.height;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 1024, ch);
  ctx.fillStyle = labelColor;
  ctx.font = `bold ${Math.round(ch * 0.44)}px ${FONT}`;
  ctx.textBaseline = 'middle';
  if (pointRight) { ctx.textAlign = 'left'; ctx.fillText(label, 52, ch / 2 + 4); }
  else { ctx.textAlign = 'right'; ctx.fillText(label, 972, ch / 2 + 4); }
  g.add(canvasFace(shape, c, D + 0.002));
  g.userData.halfW = w / 2;
  return g;
}
// cloud composed of flat discs + a base bar, one color — reads as one blob
function headCloud({ w, bg, faced = false }) {
  const g = new THREE.Group();
  const lobes = [
    [0, 0.1, 0.3], [-0.33, 0, 0.22], [0.33, 0, 0.22], [-0.14, 0.2, 0.2], [0.16, 0.19, 0.21],
  ];
  for (const [dx, dy, r] of lobes) {
    const lobe = extrudeFlat(circleShape(r * w), D, bg);
    lobe.position.set(dx * w, dy * w, 0);
    g.add(lobe);
  }
  const bar = extrudeFlat(roundedRectShape(w * 0.92, w * 0.3, w * 0.14), D, bg);
  bar.position.set(0, -w * 0.05, 0);
  g.add(bar);
  if (faced) g.add(smileyFace(w * 0.2, D + 0.003));
  g.userData.halfW = w * 0.58;
  return g;
}
// flower of flat petal discs around a center, sticker-style
function headFlower({ R, petal, center, faced = true }) {
  const g = new THREE.Group();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const p = extrudeFlat(circleShape(R * 0.42), D, petal);
    p.position.set(Math.cos(a) * R * 0.58, Math.sin(a) * R * 0.58, 0);
    g.add(p);
  }
  const c = extrudeFlat(circleShape(R * 0.42), D + 0.004, center);
  g.add(c);
  if (faced) g.add(smileyFace(R * 0.3, D + 0.009));
  g.userData.halfW = R;
  return g;
}

/* ------------------------------ posts → signs ----------------------------- */
const SIGNS = {
  archive:     () => headBlade({ w: 2.1, h: 0.62, bg: PAL.blue, label: 'ARCHIVE', labelColor: PAL.white, pointRight: true }),
  about:       () => headBlade({ w: 1.7, h: 0.55, bg: PAL.black, label: 'ABOUT', labelColor: PAL.white, pointRight: false }),
  how:         () => headCircle({ R: 0.52, bg: PAL.white, ring: PAL.red, label: '∞', labelColor: PAL.black }),
  warning:     () => headTriangle({ size: 1.15, bg: PAL.red, inner: PAL.white, label: '!', labelColor: PAL.black }),
  garden:      () => headFlower({ R: 0.62, petal: PAL.pink, center: PAL.yellow }),
  drift:       () => headCircle({ R: 0.56, bg: PAL.blue, ring: PAL.white, wavy: true, labelColor: PAL.white }),
  elevators:   () => headSquare({ w: 1.05, bg: PAL.red, border: PAL.white, label: 'ELEV', labelColor: PAL.white, arrowUp: true }),
  tender:      () => headCloud({ w: 1.15, bg: PAL.pink, faced: true }),
  tuesday:     () => headOctagon({ R: 0.62, bg: PAL.red, ring: PAL.white, label: 'TUE', labelColor: PAL.white }),
  peonies:     () => headOctagon({ R: 0.55, bg: PAL.white, ring: PAL.pinkDeep, label: '❀', labelColor: PAL.pinkDeep }),
  loadbearing: () => headTriangle({ size: 1.1, bg: PAL.blue, inner: PAL.white, label: 'D', labelColor: PAL.blue }),
  liquidmetal: () => headCloud({ w: 1.05, bg: PAL.blue, faced: false }),
  doorhandles: () => headSquare({ w: 0.95, bg: PAL.white, border: PAL.blue, label: '⌐●', labelColor: PAL.blue }),
  honesty:     () => headCircle({ R: 0.5, bg: PAL.pink, ring: PAL.white, label: 'HI', labelColor: PAL.white }),
};

/* --------------------------------- posts ---------------------------------- */
const artefacts = [];
const hitMeshes = [];
const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });

function makePost(postId, headBuilder, { x, z, h, tilt = 0 }) {
  const post = POSTS.find((p) => p.id === postId) || { id: postId, tag: 'index' };
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = jitter(0.12);

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, h, 12), flat(PAL.pole));
  pole.position.y = h / 2;
  pole.castShadow = true;
  g.add(pole);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.07, 12), flat(PAL.poleDark));
  collar.position.y = h - 0.1;
  g.add(collar);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.05, 16), flat(PAL.poleDark));
  foot.position.y = 0.025;
  g.add(foot);

  const head = headBuilder();
  head.position.set(0, h, 0.045);
  head.rotation.z = tilt;
  g.add(head);

  scene.add(g);

  const art = { post, group: g, head, baseY: h, phase: rand() * Math.PI * 2, hoverK: 0 };
  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.42, head.userData.halfW * 1.05), 8, 8), hitMat);
  hit.position.copy(head.position);
  g.add(hit);
  hit.userData.artefact = art;
  hitMeshes.push(hit);
  artefacts.push(art);
  return art;
}

/* ------------------------------ the sign field ----------------------------
   Three loose rows, staggered heights, poster composition. ----------------- */
// back row — tall
makePost('archive',   SIGNS.archive,   { x: -2.7, z: -1.7, h: 3.15 });
makePost('elevators', SIGNS.elevators, { x: -0.4, z: -1.9, h: 3.3, tilt: jitter(0.04) });
makePost('how',       SIGNS.how,       { x: 1.35, z: -1.6, h: 3.0 });
makePost('tuesday',   SIGNS.tuesday,   { x: 3.1, z: -1.8, h: 3.2 });
// middle row
makePost('about',       SIGNS.about,       { x: -3.7, z: -0.2, h: 2.6 });
makePost('loadbearing', SIGNS.loadbearing, { x: -1.9, z: 0.0, h: 2.45, tilt: jitter(0.05) });
makePost('liquidmetal', SIGNS.liquidmetal, { x: 0.4, z: -0.3, h: 2.75 });
makePost('honesty',     SIGNS.honesty,     { x: 2.1, z: 0.1, h: 2.3 });
makePost('warning',     SIGNS.warning,     { x: 3.9, z: -0.1, h: 2.55, tilt: jitter(0.05) });
// front row — short
makePost('garden',      SIGNS.garden,      { x: -2.8, z: 1.5, h: 1.7 });
makePost('drift',       SIGNS.drift,       { x: -1.0, z: 1.7, h: 1.45 });
makePost('tender',      SIGNS.tender,      { x: 1.0, z: 1.5, h: 1.8 });
makePost('doorhandles', SIGNS.doorhandles, { x: 2.6, z: 1.75, h: 1.5 });
makePost('peonies',     SIGNS.peonies,     { x: 4.1, z: 1.4, h: 1.85 });

/* ---------------------- big flat arrows weaving through -------------------- */
const decorations = [];
function addArrow(shape, color, { x, y, z, rz = 0, ry = 0, flip = false }) {
  const m = extrudeFlat(shape, 0.06, color);
  m.position.set(x, y, z);
  m.rotation.set(0, ry, rz);
  if (flip) m.scale.x = -1;
  scene.add(m);
  decorations.push({ mesh: m, y0: y, phase: rand() * Math.PI * 2, bob: 0.3 + rand() * 0.3 });
  return m;
}
addArrow(uTurnArrowShape(0.55, 0.34, 0.75), PAL.blue, { x: 0.35, y: 2.35, z: 0.75, rz: -0.06 });
addArrow(bentArrowShape(0.8, 0.5, 0.36, 0.42), PAL.blue, { x: -5.5, y: 1.45, z: -0.9, rz: 0, flip: false });
addArrow(straightArrowShape(2.6, 0.34), PAL.blue, { x: 3.1, y: 1.3, z: 1.1, rz: 0.5 });
addArrow(straightArrowShape(1.7, 0.28), PAL.blue, { x: -3.6, y: 3.75, z: -2.6, rz: -0.12, flip: true });

// a few floating flat confetti shapes
function addChip(mesh, x, y, z) {
  mesh.position.set(x, y, z);
  scene.add(mesh);
  decorations.push({ mesh, y0: y, phase: rand() * Math.PI * 2, bob: 0.4 + rand() * 0.4, spin: 0.2 });
}
addChip(extrudeFlat(circleShape(0.14), 0.05, PAL.pink), -4.4, 3.6, -1.2);
addChip(extrudeFlat(regPolyShape(4, 0.16, 45, 0.03), 0.05, PAL.red), 4.6, 3.3, -0.6);
addChip(extrudeFlat(circleShape(0.1), 0.05, PAL.yellow), 4.9, 1.9, 0.6);
addChip(extrudeFlat(circleShape(0.09), 0.05, PAL.blue), -4.8, 1.6, 1.0);

/* ------------------------------ reading veil ------------------------------- */
const veil = document.getElementById('veil');
const sheet = document.getElementById('sheet');
const articleEl = document.getElementById('article');
const indexEl = document.getElementById('indexList');
const idxUl = document.getElementById('idx-ul');
let veilOpen = false;

const TAG_COLORS = {
  life: PAL.pinkDeep, misc: PAL.yellow, absurd: PAL.red,
  design: PAL.blue, company: PAL.blue, work: PAL.blue,
  about: PAL.black, wayfinding: PAL.red, manifesto: PAL.red,
};

function openWriting(post) {
  articleEl.classList.remove('off');
  indexEl.classList.remove('on');
  document.getElementById('w-dot').style.background = TAG_COLORS[post.tag] || PAL.black;
  document.getElementById('w-tag').textContent = post.tag;
  document.getElementById('w-date').textContent = post.date;
  document.getElementById('w-title').textContent = post.title;
  document.getElementById('w-body').textContent = post.body;
  veil.classList.add('open');
  veilOpen = true;
}
function openIndex() {
  articleEl.classList.add('off');
  indexEl.classList.add('on');
  idxUl.innerHTML = '';
  for (const post of POSTS) {
    const li = document.createElement('li');
    const dot = document.createElement('span');
    dot.className = 'idot';
    dot.style.background = TAG_COLORS[post.tag] || PAL.black;
    const title = document.createElement('span');
    title.className = 'ititle';
    title.textContent = post.title;
    const tag = document.createElement('span');
    tag.className = 'itag';
    tag.textContent = post.tag;
    const date = document.createElement('span');
    date.className = 'idate';
    date.textContent = post.date;
    li.append(dot, title, tag, date);
    li.addEventListener('click', (e) => {
      e.stopPropagation();
      openWriting(post);
    });
    idxUl.appendChild(li);
  }
  veil.classList.add('open');
  veilOpen = true;
}
function closeVeil() {
  veil.classList.remove('open');
  veilOpen = false;
}
veil.addEventListener('click', closeVeil);
sheet.addEventListener('click', (e) => e.stopPropagation());
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVeil(); });

/* ------------------------------ interaction -------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
let hovered = null;
let pointerDown = { x: 0, y: 0, moved: false };

renderer.domElement.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  if (Math.abs(e.clientX - pointerDown.x) + Math.abs(e.clientY - pointerDown.y) > 6) {
    pointerDown.moved = true;
  }
});
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDown = { x: e.clientX, y: e.clientY, moved: false };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (pointerDown.moved || veilOpen) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  if (!hits.length) return;
  const art = hits[0].object.userData.artefact;
  if (art.post.id === 'archive') openIndex();
  else openWriting(art.post);
});

/* -------------------------------- animate ---------------------------------- */
const clock = new THREE.Clock();
let introT = 0;
for (const a of artefacts) a.group.scale.set(1, 0.0001, 1);

function easeOutBack(t) {
  const c1 = 1.30158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
const introOrder = [...artefacts].sort((a, b) => a.group.position.x - b.group.position.x);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  introT += dt;

  introOrder.forEach((a, i) => {
    const local = THREE.MathUtils.clamp((introT - 0.25 - i * 0.07) / 0.6, 0, 1);
    const k = local >= 1 ? 1 : Math.max(0.0001, easeOutBack(local));
    a.group.scale.y = k;
  });

  for (const a of artefacts) {
    // sticker hover: head lifts and tips
    const target = a === hovered ? 1 : 0;
    a.hoverK += (target - a.hoverK) * Math.min(1, dt * 9);
    a.head.position.y = a.baseY + a.hoverK * 0.09 + Math.sin(t * 0.8 + a.phase) * 0.012;
    a.head.rotation.y = a.hoverK * 0.12;
  }
  for (const d of decorations) {
    d.mesh.position.y = d.y0 + Math.sin(t * d.bob + d.phase) * 0.07;
    if (d.spin) d.mesh.rotation.z += dt * d.spin;
  }

  if (!veilOpen) {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(hitMeshes, false);
    const found = hits.length ? hits[0].object.userData.artefact : null;
    if (found !== hovered) {
      hovered = found;
      document.body.style.cursor = hovered ? 'pointer' : 'default';
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

document.getElementById('loader').classList.add('done');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
