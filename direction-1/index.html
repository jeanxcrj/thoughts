/* ---------------------------------- rng ---------------------------------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260706);
const jitter = (amt) => (rand() * 2 - 1) * amt;

const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function toTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function drawArrow(ctx, x, y, len, thick, dir = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  ctx.beginPath();
  const headL = thick * 1.9, headW = thick * 1.75;
  ctx.moveTo(-len / 2, -thick / 2);
  ctx.lineTo(len / 2 - headL, -thick / 2);
  ctx.lineTo(len / 2 - headL, -headW);
  ctx.lineTo(len / 2, 0);
  ctx.lineTo(len / 2 - headL, headW);
  ctx.lineTo(len / 2 - headL, thick / 2);
  ctx.lineTo(-len / 2, thick / 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
// 4-point pinched sparkle, the collage's signature mark
function drawSparkle(ctx, x, y, r, color, pinch = 0.14) {
  const k = r * pinch;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x + k, y - k, x + r, y);
  ctx.quadraticCurveTo(x + k, y + k, x, y + r);
  ctx.quadraticCurveTo(x - k, y + k, x - r, y);
  ctx.quadraticCurveTo(x - k, y - k, x, y - r);
  ctx.closePath();
  ctx.fill();
}
function drawGrid(ctx, w, h, step, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  for (let x = 0; x <= w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y <= h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}
// halftone dot field: fn(u,v) → 0..1 dot size
function halftone(ctx, x0, y0, w, h, fn, color, step = 16) {
  ctx.fillStyle = color;
  for (let y = y0 + step / 2; y < y0 + h; y += step) {
    for (let x = x0 + step / 2; x < x0 + w; x += step) {
      const b = fn((x - x0) / w, (y - y0) / h);
      if (b <= 0.03) continue;
      ctx.beginPath();
      ctx.arc(x, y, (step * 0.46) * Math.min(1, b), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
function cloudBlob(ctx, x, y, s, color) {
  ctx.fillStyle = color;
  const lobes = [[0, 0, 1], [-0.9, 0.15, 0.72], [0.9, 0.18, 0.68], [-0.45, -0.42, 0.62], [0.42, -0.45, 0.66], [0, 0.3, 0.85]];
  for (const [dx, dy, r] of lobes) {
    ctx.beginPath();
    ctx.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ------ squares ------ */
function artSunflower() {
  const [c, ctx] = makeCanvas(640, 640);
  ctx.fillStyle = BLUE; ctx.fillRect(0, 0, 640, 640);
  const cx = 320, cy = 320;
  // two rings of white petals
  for (let ring = 0; ring < 2; ring++) {
    const n = ring === 0 ? 14 : 12;
    const R = ring === 0 ? 210 : 175;
    const len = ring === 0 ? 118 : 96;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + ring * 0.24;
      ctx.save();
      ctx.translate(cx + Math.cos(a) * R * 0.62, cy + Math.sin(a) * R * 0.62);
      ctx.rotate(a);
      ctx.fillStyle = ring === 0 ? '#ffffff' : 'rgba(255,255,255,0.88)';
      ctx.beginPath();
      ctx.ellipse(len * 0.55, 0, len, 34, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  // blue center with dotted white rings
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.arc(cx, cy, 128, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(cx, cy, 126, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  for (let r = 18; r < 120; r += 26) {
    const n = Math.max(6, Math.round(r * 0.5));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + r;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  return c;
}

function artStarburst() {

  const [c, ctx] = makeCanvas(640, 640);

}

function artTriPaper() {
  const [c, ctx] = makeCanvas(640, 576);
  const apex = [320, 26], bl = [30, 546], br = [610, 546];
  const cx0 = 320, cy0 = 372;
  const tri = (inset) => {
    ctx.beginPath();
    [apex, br, bl].forEach((p, i) => {
      const x = p[0] + (cx0 - p[0]) * inset;
      const y = p[1] + (cy0 - p[1]) * inset;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);

/* --------------------------- geometry helpers ----------------------------- */
const SIGN_T = 0.035;
const FRAME_W = 0.045;
const FRAME_D = SIGN_T + 0.022;

function remapUVsToBounds(geometry) {
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const sx = bb.max.x - bb.min.x, sy = bb.max.y - bb.min.y;
  const pos = geometry.attributes.position;
  const uv = geometry.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    uv.setXY(i, (pos.getX(i) - bb.min.x) / sx, (pos.getY(i) - bb.min.y) / sy);
  }
  uv.needsUpdate = true;
}

function roundedPolygonShape(points, radius) {
  const shape = new THREE.Shape();
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const p = points[i];
    const prev = points[(i + n - 1) % n];
    const next = points[(i + 1) % n];
    const dPrev = p.clone().sub(prev).normalize();
    const dNext = next.clone().sub(p).normalize();
    const pA = p.clone().sub(dPrev.clone().multiplyScalar(radius));
    const pB = p.clone().add(dNext.clone().multiplyScalar(radius));
    if (i === 0) shape.moveTo(pA.x, pA.y); else shape.lineTo(pA.x, pA.y);
    shape.quadraticCurveTo(p.x, p.y, pB.x, pB.y);
  }
  shape.closePath();
  return shape;
}

/* ------------------------------ sign builders ----------------------------- */
const faceMeshes = [];

function faceMaterial(canvas) {
  return new THREE.MeshStandardMaterial({
    map: toTexture(canvas),
    metalness: 0.2,
    roughness: 0.5,
  });
}

function buildRectSign(w, h, canvas) {
  const g = new THREE.Group();
  const faceMat = faceMaterial(canvas);
  const panel = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, SIGN_T),
    [backMat, backMat, backMat, backMat, faceMat, backMat]
  );
  panel.position.z = SIGN_T / 2;
  panel.castShadow = true;
  panel.receiveShadow = true;
  g.add(panel);
  faceMeshes.push(panel);

  const bars = [
    [w + FRAME_W * 2, FRAME_W, 0, h / 2 + FRAME_W / 2],
    [w + FRAME_W * 2, FRAME_W, 0, -h / 2 - FRAME_W / 2],
    [FRAME_W, h, -w / 2 - FRAME_W / 2, 0],
    [FRAME_W, h, w / 2 + FRAME_W / 2, 0],
  ];
  for (const [bw, bh, bx, by] of bars) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, FRAME_D), frameMat);
    bar.position.set(bx, by, SIGN_T / 2);
    bar.castShadow = true;
    bar.receiveShadow = true;
    g.add(bar);
  }
  return g;
}

function buildCircleSign(r, canvas) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, SIGN_T, 48), backMat);
  body.rotation.x = Math.PI / 2;
  body.position.z = SIGN_T / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);
  const face = new THREE.Mesh(new THREE.CircleGeometry(r * 0.995, 48), faceMaterial(canvas));
  face.position.z = SIGN_T + 0.002;
  face.receiveShadow = true;
  g.add(face);
  faceMeshes.push(face);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r + 0.012, 0.032, 20, 64), frameMat);
  rim.position.z = SIGN_T / 2;
  rim.castShadow = true;
  rim.receiveShadow = true;
  g.add(rim);
  return g;
}

function buildTriangleSign(size, canvas) {
  const g = new THREE.Group();
  const R = size * 0.62;
  const pts = [90, 210, 330].map((deg) => {
    const a = (deg * Math.PI) / 180;
    return new THREE.Vector2(Math.cos(a) * R, Math.sin(a) * R);
  });
  const shape = roundedPolygonShape(pts, size * 0.09);

  const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: SIGN_T, bevelEnabled: false, curveSegments: 10 });
  const body = new THREE.Mesh(bodyGeo, backMat);
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  const faceGeo = new THREE.ShapeGeometry(shape, 10);
  remapUVsToBounds(faceGeo);
  const face = new THREE.Mesh(faceGeo, faceMaterial(canvas));
  face.scale.set(0.985, 0.985, 1);
  face.position.z = SIGN_T + 0.002;
  face.receiveShadow = true;
  g.add(face);
  faceMeshes.push(face);

  const outline = shape.getPoints(48).map((p) => new THREE.Vector3(p.x, p.y, SIGN_T / 2));
  const curve = new THREE.CatmullRomCurve3(outline, true, 'catmullrom', 0.0);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 140, 0.03, 12, true), frameMat);
  tube.castShadow = true;
  tube.receiveShadow = true;
  g.add(tube);
  return g;
}

/* --------------------------- pole hardware bits --------------------------- */
function addClampRing(y, extraBolt = true) {
  const ring = new THREE.Mesh(
    new THREE.CylinderGeometry(POLE_R + 0.022, POLE_R + 0.022, 0.085, 32),
    clampMat
  );
  ring.position.y = y;
  ring.castShadow = true;
  ring.receiveShadow = true;
  scene.add(ring);
  if (extraBolt) {
    const bolt = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.06, 0.045), clampMat);
    const a = rand() * Math.PI * 2;
    bolt.position.set(Math.cos(a) * (POLE_R + 0.035), y, Math.sin(a) * (POLE_R + 0.035));
    bolt.castShadow = true;
    scene.add(bolt);
  }
  return ring;
}

/* ------------------------------- mounting --------------------------------- */
const signs = [];

function mountSign(group, { height, angleDeg, dist, tiltZ = 0, tiltX = 0, twistY = 0 }) {
  const pivot = new THREE.Group();
  pivot.position.y = height;
  pivot.rotation.y = (angleDeg * Math.PI) / 180;
  scene.add(pivot);

  const holder = new THREE.Group();
  holder.position.z = POLE_R + dist;
  holder.rotation.set(tiltX, twistY, tiltZ);
  pivot.add(holder);
  holder.add(group);

  addClampRing(height);

  const armLen = dist + POLE_R * 0.7;
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, armLen, 16), armMat);
  arm.rotation.x = Math.PI / 2;
  arm.position.z = POLE_R * 0.3 + armLen / 2;
  arm.castShadow = true;
  arm.receiveShadow = true;
  pivot.add(arm);

  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.02), armMat);
  plate.position.z = -0.01;
  group.add(plate);

  signs.push({ pivot, holder, group, wobble: 0, wobbleVel: 0, phase: rand() * Math.PI * 2 });
  return pivot;
}

/* ------------------------------ composition ------------------------------- */
const GOLDEN = 137.508;
let angleCursor = rand() * 360;
function nextAngle() {
  angleCursor += GOLDEN + jitter(16);
  return angleCursor % 360;
}

const composition = [
  { build: () => buildRectSign(1.55, 0.52, artNavigate()),     h: 5.95 },
  { build: () => buildTriangleSign(0.95, artTriPaper()),       h: 6.55 },
  { build: () => buildCircleSign(0.42, artStarburst()),        h: 5.35 },
  { build: () => buildRectSign(1.5, 0.55, artCloudsWide()),    h: 4.85 },
  { build: () => buildRectSign(0.5, 1.35, artPopsicle()),      h: 4.28 },
  { build: () => buildRectSign(0.72, 0.72, artSunflower()),    h: 3.72 },
  { build: () => buildCircleSign(0.4, artCloudPorthole()),     h: 3.3 },
  { build: () => buildRectSign(1.45, 0.5, artGridSquiggle()),  h: 2.78 },
  { build: () => buildTriangleSign(0.9, artTriHalftone()),     h: 2.25 },
  { build: () => buildRectSign(0.48, 1.3, art06()),            h: 1.75 },
  { build: () => buildCircleSign(0.38, artOrbHalftone()),      h: 1.15 },
  { build: () => buildRectSign(0.68, 0.68, artBlueHour()),     h: 0.72 },
];

for (const item of composition) {
  const group = item.build();
  mountSign(group, {
    height: item.h + jitter(0.16),
    angleDeg: nextAngle(),
    dist: 0.3 + rand() * 0.42,
    tiltZ: jitter(0.045),
    tiltX: jitter(0.03),
    twistY: jitter(0.1),
  });
}

addClampRing(0.45, false);
addClampRing(2.52);
addClampRing(4.6, false);
addClampRing(7.05);

/* ------------------------- floating collage props ------------------------- */
const props = [];

function sparkleShape3D(r) {
  const k = r * 0.14;
  const s = new THREE.Shape();
  s.moveTo(0, r);
  s.quadraticCurveTo(k, k, r, 0);
  s.quadraticCurveTo(k, -k, 0, -r);
  s.quadraticCurveTo(-k, -k, -r, 0);
  s.quadraticCurveTo(-k, k, 0, r);
  return s;
}
const sparkleWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.4 });
const sparkleBlue = new THREE.MeshStandardMaterial({ color: 0x1d35e6, metalness: 0.4, roughness: 0.4 });

function addSparkleProp(x, y, z, r, blue = true) {
  const geo = new THREE.ExtrudeGeometry(sparkleShape3D(r), { depth: r * 0.1, bevelEnabled: false });
  const m = new THREE.Mesh(geo, blue ? sparkleBlue : sparkleWhite);
  if (!blue) {
    // blue backing sparkle so white reads on white
    const back = new THREE.Mesh(geo, sparkleBlue);
    back.scale.setScalar(1.22);
    back.position.z = -r * 0.03;
    m.add(back);
  }
  m.position.set(x, y, z);
  m.castShadow = true;
  scene.add(m);
  props.push({ mesh: m, spin: 0.25 + rand() * 0.3, bob: 0.5 + rand(), phase: rand() * Math.PI * 2, y0: y });
  return m;
}
addSparkleProp(1.9, 6.1, -0.7, 0.22, true);
addSparkleProp(-1.6, 4.7, 1.2, 0.16, false);
addSparkleProp(1.4, 2.1, 1.5, 0.13, true);
addSparkleProp(-1.9, 1.2, -1.1, 0.18, false);
addSparkleProp(0.4, 7.1, 1.6, 0.1, true);

const ringMat = new THREE.MeshStandardMaterial({ color: 0x1d35e6, metalness: 0.5, roughness: 0.4 });
function addRingProp(x, y, z, r) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 10, 64), ringMat);
  m.position.set(x, y, z);
  m.rotation.set(rand() * Math.PI, rand() * Math.PI, 0);
  m.castShadow = true;
  scene.add(m);
  props.push({ mesh: m, spin: 0.12 + rand() * 0.15, bob: 0.4 + rand() * 0.6, phase: rand() * Math.PI * 2, y0: y });
}
addRingProp(-2.1, 5.6, -0.4, 0.42);
addRingProp(2.2, 3.4, -1.3, 0.3);

// hand-drawn blue line meandering on the floor
{
  const pts = [];
  let a = rand() * Math.PI * 2;
  for (let i = 0; i <= 10; i++) {
    const r = 1.1 + i * 0.34 + jitter(0.22);
    a += 0.55 + jitter(0.28);
    pts.push(new THREE.Vector3(Math.cos(a) * r, 0.015, Math.sin(a) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.014, 8, false), ringMat);
  scene.add(tube);
}

/* ------------------------------ interaction ------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
let hovered = null;
let pointerDown = { x: 0, y: 0, moved: false };

function findSignFor(object) {
  return signs.find((s) => {
    let hit = false;
    s.group.traverse((o) => { if (o === object) hit = true; });
    return hit;
  });
}

renderer.domElement.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  if (Math.abs(e.clientX - pointerDown.x) + Math.abs(e.clientY - pointerDown.y) > 6) {
    pointerDown.moved = true;
  }
});
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDown = { x: e.clientX, y: e.clientY, moved: false };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (pointerDown.moved) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(faceMeshes, false);
  const s = hits.length ? findSignFor(hits[0].object) : null;
  if (s) s.wobbleVel += 3.2 + rand() * 1.5;
});

/* -------------------------------- animate --------------------------------- */
const clock = new THREE.Clock();
let introT = 0;
for (const s of signs) s.group.scale.setScalar(0.0001);

function easeOutBack(t) {
  const c1 = 1.30158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  introT += dt;

  signs.forEach((s, i) => {
    const local = THREE.MathUtils.clamp((introT - 0.35 - i * 0.09) / 0.55, 0, 1);
    const k = local >= 1 ? 1 : Math.max(0.0001, easeOutBack(local));
    s.group.scale.setScalar(k);
  });

  for (const s of signs) {
    const stiffness = 26, damping = 4.2;
    s.wobbleVel += -s.wobble * stiffness * dt - s.wobbleVel * damping * dt;
    s.wobble += s.wobbleVel * dt;
    const idle = Math.sin(t * 0.7 + s.phase) * 0.006;
    s.holder.rotation.z = (s.holder.userData.baseZ ??= s.holder.rotation.z) + idle;
    s.group.rotation.x = s.wobble * 0.12;
  }

  for (const p of props) {
    p.mesh.rotation.z += p.spin * dt;
    p.mesh.position.y = p.y0 + Math.sin(t * p.bob + p.phase) * 0.08;
  }

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(faceMeshes, false);
  const found = hits.length ? findSignFor(hits[0].object) : null;
  if (found !== hovered) {
    hovered = found;
    document.body.style.cursor = hovered ? 'pointer' : 'default';
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

document.getElementById('loader').classList.add('done');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
